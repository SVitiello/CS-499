<div class="login-page">
  <div class="login-card">
    <h2>Welcome!</h2>
    <p class="login-subtitle">Please log in to search and manage rescue animals.</p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="Enter your username"
          [(ngModel)]="username"
          (ngModelChange)="errorMessage = ''"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          [(ngModel)]="password"
          (ngModelChange)="errorMessage = ''"
        />
      </div>

      <button type="submit">Log In</button>

      <p *ngIf="errorMessage" class="login-error">
        {{ errorMessage }}
      </p>
    </form>
  </div>

  <div class="login-card">
    <h2>Register</h2>
    <p class="login-subtitle">Create a new username and password.</p>

    <form (ngSubmit)="register()">
      <div class="form-group">
        <label for="registerUsername">Username</label>
        <input
          id="registerUsername"
          name="registerUsername"
          type="text"
          placeholder="Choose a username"
          [(ngModel)]="registerUsername"
          (ngModelChange)="registerMessage = ''; registerErrorMessage = ''"
        />
      </div>

      <div class="form-group">
        <label for="registerPassword">Password</label>
        <input
          id="registerPassword"
          name="registerPassword"
          type="password"
          placeholder="Choose a password"
          [(ngModel)]="registerPassword"
          (ngModelChange)="registerMessage = ''; registerErrorMessage = ''"
        />
      </div>

      <button type="submit">Register</button>

      <p *ngIf="registerMessage" class="success-message">
        {{ registerMessage }}
      </p>

      <p *ngIf="registerErrorMessage" class="login-error">
        {{ registerErrorMessage }}
      </p>
    </form>
  </div>
</div>
